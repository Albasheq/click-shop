<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصل بنا</title>
    <link rel="stylesheet" href="contact_us.css">
</head>

<body>

    <h1>اتصل بنا</h1>

    <form action="mailto:hamoodgaswan9@gmail.com" method="post" enctype="text/plain">

        <fieldset>
            <legend>أرسل لنا رسالة</legend>

            <label for="name">الاسم:</label>
            <input type="text" id="name" name="name" placeholder="أدخل اسمك" required>

            <label for="email">البريد الإلكتروني:</label>
            <input type="email" id="email" name="email" placeholder="أدخل بريدك الإلكتروني" required>

            <label for="message">الرسالة:</label>
            <textarea id="message" name="message" placeholder="أدخل رسالتك" required></textarea>

            <div class="buttons">
                <input type="reset" value="إعادة تعيين">
                <input type="submit" value="إرسال">
            </div>
        </fieldset>
    </form>

</body>

</html>
