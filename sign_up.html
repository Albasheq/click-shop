<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>إنشاء حساب جديد</title>
    <link rel="stylesheet" href="sign_up.css">
</head>

<body>

    <div class="register-container">
        <h2>إنشاء حساب جديد</h2>
        <form>
            <div class="form-group">
                <label for="fullname">الاسم الكامل</label>
                <input type="text" id="fullname" placeholder="أدخل اسمك الكامل">
            </div>

            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="أدخل بريدك الإلكتروني">
            </div>

            <div class="form-group">
                <label for="username">اسم المستخدم</label>
                <input type="text" id="username" placeholder="اختر اسم مستخدم">
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="أنشئ كلمة مرور قوية">
            </div>

            <div class="form-group">
                <label for="confirm-password">تأكيد كلمة المرور</label>
                <input type="password" id="confirm-password" placeholder="أعد إدخال كلمة المرور">
            </div>

            <button type="submit">إنشاء الحساب</button>
        </form>
        <div class="footer-text">
            لديك حساب؟ <a href="login3.html" style="color: yellow;">تسجيل الدخول</a>
        </div>
    </div>

</body>

</html>
